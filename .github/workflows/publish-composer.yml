name: Publish Krea2 Composer to Comfy Registry

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Composer commit SHA or release tag to publish
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  publish-composer:
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'cyberdeliaAI' }}
    steps:
      - name: Check out Composer
        uses: actions/checkout@v4
        with:
          repository: cyberdeliaAI/comfyui-krea2-two-character-composer
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate publisher and project identity
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path
          config = tomllib.loads(Path('pyproject.toml').read_text())
          assert config['project']['name'] == 'comfyui-krea2-two-character-composer'
          assert config['tool']['comfy']['PublisherId'] == 'cyberdelia'
          assert config['project']['urls']['Repository'] == 'https://github.com/cyberdeliaAI/comfyui-krea2-two-character-composer'
          print('Publishing Krea2 Composer', config['project']['version'], 'as cyberdelia')
          PY
      - name: Install Registry CLI
        run: python -m pip install comfy-cli
      - name: Publish Composer
        env:
          COMFY_REGISTRY_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: comfy --skip-prompt --no-enable-telemetry node publish --token "$COMFY_REGISTRY_TOKEN"
